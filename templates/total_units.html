<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h4>Academic Summary</h4>
        </div>
        <div class="card-body">
            <h5 class="card-title">Total Units Registered</h5>
            <p class="display-4">{{ total_units }}</p>
            <p class="text-muted">This represents the sum of all unit loads for every course you have successfully registered.</p>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>
</div>

</body>
</html>
