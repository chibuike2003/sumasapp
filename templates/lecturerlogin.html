<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Lecturer Login | EquiLink</title>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">
    <form method="POST" class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Lecturer Login</h2>
        <div class="space-y-4">
            <input type="email" name="email" placeholder="Email Address" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" name="password" placeholder="Password" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Sign In</button>
        </div>
    </form>
</body>
</html>
