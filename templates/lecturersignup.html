<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Lecturer Sign Up | EquiLink</title>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">
    <form method="POST" class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Create Lecturer Account</h2>
        <div class="space-y-4">
            <input type="text" name="name" placeholder="Full Name" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="email" name="email" placeholder="Email Address" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" name="password" placeholder="Password" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="text" name="department" placeholder="Department" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">Register</button>
        </div>
        <p class="text-center text-sm text-gray-500 mt-4">Already have an account? <a href="/lecturer/login" class="text-blue-600">Login</a></p>
    </form>
</body>
</html>
